<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            width: 100%;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        .weather-result, .error {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <header>
        <h1>Weather Dashboard</h1>
    </header>
    <main>
        <input type="text" id="city" aria-label="Enter city name" placeholder="Enter city name" required>
        <button id="searchBtn">Get Weather</button>
        <div id="result" class="weather-result" aria-live="polite"></div>
        <div class="error" id="errorMsg" style="display: none;"></div>
        <h2>API Settings</h2>
        <input type="password" id="apiKey" aria-label="Enter your API key" placeholder="Enter your API key">
        <button id="saveKeyBtn">Save API Key</button>
    </main>
    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const errorMsg = document.getElementById('errorMsg');

        const saveApiKey = () => {
            const apiKey = apiKeyInput.value.trim();
            if (apiKey) {
                localStorage.setItem('weatherApiKey', apiKey);
                alert('API Key saved successfully');
            } else {
                alert('Please enter a valid API Key');
            }
        };

        const fetchWeather = async (city) => {
            const apiKey = localStorage.getItem('weatherApiKey');
            if (!apiKey) {
                displayError('API key is missing. Please enter your API key.');
                return;
            }
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);
                if (!response.ok) {
                    throw new Error('City not found or API key is invalid.');
                }
                const data = await response.json();
                return data;
            } catch (error) {
                displayError(error.message);
            }
        };

        const displayWeather = (data) => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `Weather in ${data.name}: ${data.main.temp}°C, ${data.weather[0].description}`;
            errorMsg.style.display = 'none';
        };

        const displayError = (message) => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';
            errorMsg.innerText = message;
            errorMsg.style.display = 'block';
        };

        document.getElementById('searchBtn').addEventListener('click', async function() {
            const city = document.getElementById('city').value.trim();
            if (city) {
                const weatherData = await fetchWeather(city);
                if (weatherData) {
                    displayWeather(weatherData);
                }
            } else {
                displayError('Please enter a city name.');
            }
        });

        document.getElementById('saveKeyBtn').addEventListener('click', saveApiKey);
    </script>
</body>
</html>
