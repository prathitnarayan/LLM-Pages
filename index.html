<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        input {
            padding: 10px;
            margin-right: 10px;
            width: 200px;
        }
        button {
            padding: 10px;
        }
        .weather-info {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .error {
            color: red;
        }
        @media (max-width: 600px) {
            input {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <h1>Weather Dashboard</h1>
    <div>
        <input type="text" id="city" aria-label="City name" placeholder="Enter city name" required>
        <button id="searchBtn">Search</button>
    </div>
    <div id="weatherInfo" class="weather-info" role="alert" aria-live="polite"></div>
    <div id="errorMsg" class="error" role="alert" aria-live="assertive"></div>
    <script>
        const apiKey = 'YOUR_API_KEY';
        document.getElementById('searchBtn').addEventListener('click', () => {
            const city = document.getElementById('city').value.trim();
            const weatherInfo = document.getElementById('weatherInfo');
            const errorMsg = document.getElementById('errorMsg');
            weatherInfo.innerHTML = '';
            errorMsg.innerHTML = '';

            if (!city) {
                errorMsg.innerHTML = 'Please enter a city name.';
                return;
            }

            fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('City not found. Please try again.');
                    }
                    return response.json();
                })
                .then(data => {
                    const temp = data.main.temp;
                    const humidity = data.main.humidity;
                    const icon = data.weather[0].icon;
                    weatherInfo.innerHTML = `
                        <h2>${data.name}</h2>
                        <p>Temperature: ${temp}°C</p>
                        <p>Humidity: ${humidity}%</p>
                        <img src="http://openweathermap.org/img/wn/${icon}.png" alt="Weather icon" />
                    `;
                })
                .catch(error => {
                    errorMsg.innerHTML = error.message;
                });
        });
    </script>
</body>
</html>
