<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: auto; padding: 1rem; }
        header { text-align: center; padding: 1rem; background: #f4f4f4; }
        .match { border: 1px solid #ccc; margin: 1rem 0; padding: 1rem; border-radius: 5px; }
        .error { color: red; }
        .notification { background: #e7f3fe; border-left: 6px solid #2196F3; padding: 0.5rem; margin: 1rem 0; }
        footer { text-align: center; padding: 1rem; background: #f4f4f4; }
    </style>
</head>
<body>
    <header>
        <h1>Live Cricket Tracker</h1>
    </header>
    <div class="container">
        <div id="liveMatches" class="match"></div>
        <div id="error" class="error"></div>
    </div>
    <footer>
        <p>&copy; 2023 Live Cricket App</p>
    </footer>
    <script>
        async function fetchLiveMatches() {
            try {
                const response = await fetch('https://api.example.com/live-matches');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                displayLiveMatches(data);
            } catch (error) {
                document.getElementById('error').innerText = 'Failed to fetch live matches: ' + error.message;
            }
        }

        function displayLiveMatches(matches) {
            const liveMatchesDiv = document.getElementById('liveMatches');
            if (matches.length === 0) {
                liveMatchesDiv.innerHTML = '<p>No live matches currently.</p>';
                return;
            }
            liveMatchesDiv.innerHTML = matches.map(match => `
                <div>
                    <h2>${match.teams[0]} vs ${match.teams[1]}</h2>
                    <p>Status: ${match.status}</p>
                    <p>Score: ${match.score}</p>
                    <p>Overs: ${match.overs}</p>
                    <p>Current Batsmen: ${match.batsmen.join(', ')}</p>
                    <p>Bowler: ${match.bowler}</p>
                </div>
            `).join('');
        }

        fetchLiveMatches();
        setInterval(fetchLiveMatches, 5000);
    </script>
</body>
</html>
