<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            width: 100%;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        .weather-result {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <header>
        <h1>Weather Dashboard</h1>
    </header>
    <main>
        <input type="text" id="city" aria-label="Enter city name" placeholder="Enter city name" required>
        <button id="searchBtn">Get Weather</button>
        <div id="result" class="weather-result" aria-live="polite"></div>
    </main>
    <script>
        const CONFIG = {
            API_KEY: "YOUR_API_KEY_HERE"
        };

        document.getElementById('searchBtn').addEventListener('click', async function() {
            const city = document.getElementById('city').value.trim();
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = ''; // Clear previous results

            if (!city) {
                resultDiv.innerHTML = '<p class="error">Please enter a city name.</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Loading...</p>';
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${CONFIG.API_KEY}&units=metric`);
                if (!response.ok) {
                    throw new Error('City not found. Please try again.');
                }
                const data = await response.json();
                if (data && data.main) {
                    resultDiv.innerHTML = `
                        <h2>${data.name}</h2>
                        <p>Temperature: ${data.main.temp} °C</p>
                        <p>Weather: ${data.weather[0].description}</p>
                    `;
                } else {
                    resultDiv.innerHTML = '<p class="error">No weather data available.</p>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
