<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Screening Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; transition: background-color 0.3s; }
        header { background: #007bff; color: white; padding: 1em; text-align: center; }
        .container { padding: 20px; }
        .dark-mode { background-color: #333; color: white; }
        .table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .table th, .table td { border: 1px solid #ddd; padding: 8px; }
        .table th { background-color: #f2f2f2; cursor: pointer; }
        .form-control { margin: 10px 0; width: 100%; padding: 10px; }
        .btn { padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .loading { display: none; }
        #themeToggle { cursor: pointer; }
        .hidden { display: none; }
        @media (max-width: 600px) {
            .table th, .table td { padding: 5px; }
            .form-control { font-size: 14px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Stock Screening Dashboard</h1>
        <button id="themeToggle" aria-label="Toggle Dark/Light Mode">Toggle Dark/Light Mode</button>
    </header>
    <div class="container">
        <input type="text" id="search" class="form-control" placeholder="Search stocks..." aria-label="Search stocks">
        <div class="loading" id="loading" aria-live="polite">Loading...</div>
        <table class="table" id="stocksTable" aria-label="Stocks Table">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">Company</th>
                    <th onclick="sortTable(1)">Ticker</th>
                    <th onclick="sortTable(2)">Price</th>
                    <th onclick="sortTable(3)">Change</th>
                    <th onclick="sortTable(4)">Market Cap</th>
                    <th onclick="sortTable(5)">Volume</th>
                </tr>
            </thead>
            <tbody id="stocksBody"></tbody>
        </table>
    </div>
    <script>
        const API_URL = 'https://api.example.com/stocks'; // Replace with actual API
        const API_KEY = 'd9bt4spr01qnupcrr420d9bt4spr01qnupcrr42g';
        
        document.getElementById('themeToggle').onclick = function() {
            document.body.classList.toggle('dark-mode');
        };

        async function fetchStocks() {
            document.getElementById('loading').classList.remove('hidden');
            try {
                const response = await fetch(`${API_URL}?apikey=${API_KEY}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                populateTable(data.stocks);
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Failed to load stock data. Please try again later.');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function populateTable(stocks) {
            const tbody = document.getElementById('stocksBody');
            tbody.innerHTML = stocks.map(stock => `
                <tr>
                    <td>${stock.company}</td>
                    <td>${stock.ticker}</td>
                    <td>${stock.price}</td>
                    <td>${stock.change}</td>
                    <td>${stock.marketCap}</td>
                    <td>${stock.volume}</td>
                </tr>
            `).join('');
        }

        function sortTable(columnIndex) {
            const tbody = document.getElementById('stocksBody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const isAscending = tbody.dataset.sortOrder === 'asc';
            rows.sort((a, b) => {
                const aText = a.children[columnIndex].textContent;
                const bText = b.children[columnIndex].textContent;
                return isAscending ? aText.localeCompare(bText) : bText.localeCompare(aText);
            });
            tbody.innerHTML = '';
            rows.forEach(row => tbody.appendChild(row));
            tbody.dataset.sortOrder = isAscending ? 'desc' : 'asc';
        }

        document.getElementById('search').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const rows = document.querySelectorAll('#stocksBody tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                const isVisible = Array.from(cells).some(cell => cell.textContent.toLowerCase().includes(query));
                row.style.display = isVisible ? '' : 'none';
            });
        });

        fetchStocks();
    </script>
</body>
</html>
