<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Screening App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #007BFF; color: white; padding: 10px; text-align: center; }
        .container { padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 10px; text-align: left; border: 1px solid #ddd; }
        th { cursor: pointer; background: #f2f2f2; }
        input, select { margin-bottom: 10px; padding: 10px; width: calc(100% - 22px); }
        .watchlist { margin-top: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 5px; }
        .close { cursor: pointer; color: red; float: right; }
        .loading { display: none; }
        @media (max-width: 600px) { th, td { font-size: 12px; } }
    </style>
</head>
<body>
    <header>
        <h1>Stock Screening App</h1>
    </header>
    <div class="container">
        <input type="text" id="search" placeholder="Search by company name or ticker..." aria-label="Search stocks">
        <button id="fetchData">Search</button>
        <div class="loading" id="loading">Loading...</div>
        <div id="error" style="color: red;"></div>
        <table id="stockTable">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">Company Name</th>
                    <th onclick="sortTable(1)">Stock Symbol</th>
                    <th onclick="sortTable(2)">Current Price</th>
                    <th onclick="sortTable(3)">Daily Change (%)</th>
                    <th onclick="sortTable(4)">Market Cap</th>
                    <th onclick="sortTable(5)">Volume</th>
                    <th onclick="sortTable(6)">52 Week High</th>
                    <th onclick="sortTable(7)">52 Week Low</th>
                </tr>
            </thead>
            <tbody id="stockData"></tbody>
        </table>
        <div class="watchlist">
            <h2>Watchlist</h2>
            <ul id="watchlistItems"></ul>
        </div>
        <div id="apiSettings">
            <h2>API Settings</h2>
            <input type="text" id="apiKey" placeholder="Enter your API Key" aria-label="API Key">
            <button id="saveKey">Save Key</button>
        </div>
    </div>
    <div class="modal" id="stockModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2 id="modalTitle"></h2>
            <div id="modalDetails"></div>
        </div>
    </div>
    <script>
        const apiKey = localStorage.getItem('apiKey');
        const apiUrl = `https://financialmodelingprep.com/api/v3/stock/real-time-price/AAPL?apikey=${apiKey || 'demo'}`;
        document.getElementById('apiKey').value = apiKey || '';
        
        document.getElementById('saveKey').onclick = () => {
            const key = document.getElementById('apiKey').value;
            localStorage.setItem('apiKey', key);
            alert('API Key saved!');
        };

        document.getElementById('fetchData').onclick = async () => {
            const search = document.getElementById('search').value;
            if (!search) return alert('Please enter a stock symbol or company name.');
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').innerText = '';
            try {
                const response = await fetch(`https://financialmodelingprep.com/api/v3/stock/real-time-price/${search}?apikey=${apiKey || 'demo'}`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                if (data.length === 0) throw new Error('No results found');
                displayStocks(data);
            } catch (error) {
                document.getElementById('error').innerText = error.message;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        };

        function displayStocks(data) {
            const stockData = document.getElementById('stockData');
            stockData.innerHTML = '';
            data.forEach(stock => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>${stock.companyName}</td>
                                <td>${stock.symbol}</td>
                                <td>${stock.price}</td>
                                <td>${stock.changePercent}</td>
                                <td>${stock.marketCap}</td>
                                <td>${stock.volume}</td>
                                <td>${stock.high}</td>
                                <td>${stock.low}</td>`;
                row.onclick = () => showModal(stock);
                stockData.appendChild(row);
            });
        }

        function showModal(stock) {
            document.getElementById('modalTitle').innerText = stock.companyName;
            document.getElementById('modalDetails').innerHTML = `
                <p>Live Price: ${stock.price}</p>
                <p>Previous Close: ${stock.previousClose}</p>
                <p>Open Price: ${stock.open}</p>
                <p>High: ${stock.high}</p>
                <p>Low: ${stock.low}</p>
                <p>Volume: ${stock.volume}</p>
                <p>Company Info: ${stock.description}</p>`;
            document.getElementById('stockModal').style.display = 'flex';
        }

        document.getElementById('closeModal').onclick = () => {
            document.getElementById('stockModal').style.display = 'none';
        };

        function sortTable(columnIndex) {
            const table = document.getElementById('stockTable');
            const rows = Array.from(table.rows).slice(1);
            const isAscending = table.rows[0].cells[columnIndex].getAttribute('data-sort') === 'asc';
            rows.sort((a, b) => {
                const aText = a.cells[columnIndex].innerText;
                const bText = b.cells[columnIndex].innerText;
                return (isAscending ? aText < bText : aText > bText) ? 1 : -1;
            });
            rows.forEach(row => table.appendChild(row));
            table.rows[0].cells[columnIndex].setAttribute('data-sort', isAscending ? 'desc' : 'asc');
        }
    </script>
</body>
</html>
