<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Screener</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        .loading { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { cursor: pointer; }
        .hidden { display: none; }
        .error { color: red; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; padding: 20px; margin: 15% auto; width: 80%; }
        @media (max-width: 600px) {
            th, td { font-size: 14px; }
        }
    </style>
</head>
<body>
    <h1>Stock Screener</h1>
    <div>
        <input type="text" id="search" placeholder="Search by company name or ticker" aria-label="Search stock">
        <button id="fetchBtn">Fetch Stocks</button>
        <div id="apiSettings" class="hidden">
            <input type="text" id="apiKey" placeholder="Enter API Key" aria-label="API Key">
            <button id="saveApiKey">Save API Key</button>
        </div>
        <div class="loading" id="loading">Loading...</div>
        <div class="error" id="errorMessage"></div>
    </div>
    <table id="stockTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Company Name</th>
                <th onclick="sortTable(1)">Ticker</th>
                <th onclick="sortTable(2)">Current Price</th>
                <th onclick="sortTable(3)">Daily Change %</th>
                <th onclick="sortTable(4)">Market Cap</th>
                <th onclick="sortTable(5)">Volume</th>
                <th onclick="sortTable(6)">Sector</th>
            </tr>
        </thead>
        <tbody id="stockBody"></tbody>
    </table>
    <div id="watchlist"></div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <span id="closeModal" style="cursor:pointer;">&times;</span>
            <h2 id="modalTitle"></h2>
            <div id="modalDetails"></div>
        </div>
    </div>
    <script>
        const apiUrl = 'https://financialmodelingprep.com/api/v3/stock/real-time-price/';
        let apiKey = localStorage.getItem('apiKey') || '';
        const stockBody = document.getElementById('stockBody');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDetails = document.getElementById('modalDetails');

        document.getElementById('apiKey').value = apiKey;

        document.getElementById('saveApiKey').onclick = () => {
            apiKey = document.getElementById('apiKey').value;
            localStorage.setItem('apiKey', apiKey);
            document.getElementById('apiSettings').classList.add('hidden');
            fetchStocks();
        };

        document.getElementById('fetchBtn').onclick = fetchStocks;

        function fetchStocks() {
            loading.style.display = 'block';
            errorMessage.textContent = '';
            stockBody.innerHTML = '';
            if (!apiKey) {
                document.getElementById('apiSettings').classList.remove('hidden');
                loading.style.display = 'none';
                return;
            }
            fetch(`${apiUrl}?apikey=${apiKey}`)
                .then(response => {
                    if (!response.ok) throw new Error('Invalid API Key or response');
                    return response.json();
                })
                .then(data => {
                    if (data.length === 0) throw new Error('No data found');
                    data.forEach(stock => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${stock.companyName}</td>
                            <td>${stock.symbol}</td>
                            <td>${stock.price}</td>
                            <td>${stock.changePercent}</td>
                            <td>${stock.marketCap}</td>
                            <td>${stock.volume}</td>
                            <td>${stock.sector}</td>
                        `;
                        row.onclick = () => showModal(stock);
                        stockBody.appendChild(row);
                    });
                })
                .catch(error => {
                    errorMessage.textContent = error.message;
                })
                .finally(() => loading.style.display = 'none');
        }

        function showModal(stock) {
            modalTitle.textContent = stock.companyName;
            modalDetails.innerHTML = `
                <p>Ticker: ${stock.symbol}</p>
                <p>Current Price: ${stock.price}</p>
                <p>Daily Change %: ${stock.changePercent}</p>
                <p>Market Cap: ${stock.marketCap}</p>
                <p>Volume: ${stock.volume}</p>
                <p>Sector: ${stock.sector}</p>
            `;
            modal.style.display = 'block';
        }

        document.getElementById('closeModal').onclick = () => {
            modal.style.display = 'none';
        };

        function sortTable(columnIndex) {
            const rows = Array.from(stockBody.querySelectorAll('tr'));
            rows.sort((a, b) => {
                const aText = a.children[columnIndex].textContent.trim();
                const bText = b.children[columnIndex].textContent.trim();
                return aText.localeCompare(bText, undefined, {numeric: true});
            });
            stockBody.innerHTML = '';
            rows.forEach(row => stockBody.appendChild(row));
        }
    </script>
</body>
</html>
